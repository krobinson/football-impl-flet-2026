[project]
name = "football-impl-flet-2026"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "fastapi>=0.136.1",
    "flet-map>=0.84.0",
    "flet-mcp>=0.1.0",
    "flet-mcp-server>=0.1.1",
    "flet[all]>=0.84.0",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "flet-cli>=0.84.0",
    "flet-desktop>=0.84.0",
    "flet-web>=0.84.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v"

[tool.flet]
desktop_flavor = "full"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "football-impl-flet-2026"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
